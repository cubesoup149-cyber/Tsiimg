name: TSIcode Supabase Image Heartbeat

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove previous heartbeat image
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail-with-body \
            -X DELETE \
            "${SUPABASE_URL}/storage/v1/object/images/__heartbeat__.png" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            || true

      - name: Upload custom heartbeat image
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail-with-body \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/images/__heartbeat__.png" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: image/png" \
            --data-binary @heartbeat.png

      - name: Finished
        run: echo "TSIcode custom heartbeat image uploaded successfully."
